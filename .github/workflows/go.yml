name: Go

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted properly:"
            echo "$unformatted"
            echo "Please run `gofmt -s -w .` to format your code."
            exit 1
          fi

      - name: Go import lint
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          if [ "$(goimports -d . | wc -l)" -gt 0 ]; then
            goimports -d .
            echo "Please format Go code by running: goimports -w ./.."
            exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: Static analysis
        run: |
          export STATICCHECK_CACHE="${{ runner.temp }}/staticcheck"
          go install "honnef.co/go/tools/cmd/staticcheck@latest"
          $(go env GOPATH)/bin/staticcheck ./...
        shell: bash

      - name: Test
        run: go test -v ./... -coverprofile=coverage.out -covermode=atomic

      - name: Fuzz
        run: |
          go test -fuzz=FuzzNewSecretDescriptorList -fuzztime=10s ./provider/
          go test -fuzz=FuzzValidateFilePermission -fuzztime=10s ./provider/
          go test -fuzz=FuzzGetJsonSecrets -fuzztime=10s ./provider/
          go test  -fuzz=FuzzMountAttributes -fuzztime=10s ./server/

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Helm lint
        run: helm lint charts/*

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          fail_ci_if_error: true
          use_oidc: true
