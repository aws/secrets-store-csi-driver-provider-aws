name: Build and push test docker image

on:
  push:
    branches: ["main"]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # A pull request's code is built and tested only after a required reviewer
  # of the `integ` environment approves this run.
  authorize:
    name: Approve pull request run
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    environment: integ
    permissions: {}
    concurrency:
      group: integ-approval-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Record the approved commit
        run: echo "Approved build and integration tests for $HEAD_SHA"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  build-docker:
    name: Build Docker Image
    needs: authorize
    if: ${{ !cancelled() && (github.event_name != 'pull_request_target' || needs.authorize.result == 'success') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: linux
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      privRepo: ${{ steps.output-image.outputs.privRepo }}
      privTagSuffix: ${{ steps.output-image.outputs.privTagSuffix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        uses: docker/build-push-action@v7
        with:
          build-args: LDFLAGS=-X 'github.com/aws/secrets-store-csi-driver-provider-aws/server.Version=fakeversion' -X 'github.com/aws/secrets-store-csi-driver-provider-aws/server.ProviderVersion=fakeversion' -extldflags '-static'
          context: .
          platforms: ${{ matrix.os }}/${{ matrix.arch }}
          load: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-build:latest-${{ matrix.arch }}-${{ github.run_id }}

      - name: Output image metadata
        id: output-image
        run: |
          echo "privRepo=ghcr.io/${{ github.repository_owner }}/test-build" >> "$GITHUB_OUTPUT"
          echo "privTagSuffix=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: List images
        run: |
          docker image ls -a

  integration-tests:
    name: Integration Tests
    needs: build-docker
    if: ${{ !cancelled() && needs.build-docker.result == 'success' }}
    uses: ./.github/workflows/integ.yml
    with:
      imageRepo: ${{ needs.build-docker.outputs.privRepo }}
      imageTagAmd64: latest-amd64-${{ needs.build-docker.outputs.privTagSuffix }}
      imageTagArm64: latest-arm64-${{ needs.build-docker.outputs.privTagSuffix }}
    permissions:
      id-token: write
      contents: read
      packages: read
    secrets: inherit
