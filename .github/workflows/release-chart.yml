name: "Release Helm Chart"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  unit-test:
    uses: ./.github/workflows/go.yml
  extract-image-info:
    runs-on: ubuntu-latest
    outputs:
      imageRepo: ${{ steps.extract.outputs.imageRepo }}
      imageTag: ${{ steps.extract.outputs.imageTag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Extract image repo and tag from values.yaml
        id: extract
        run: |
          echo "imageRepo=$(yq '.image.repository' charts/secrets-store-csi-driver-provider-aws/values.yaml)" >> "$GITHUB_OUTPUT"
          echo "imageTag=$(yq '.image.tag' charts/secrets-store-csi-driver-provider-aws/values.yaml)" >> "$GITHUB_OUTPUT"
  # Stops the release unless the image values.yaml names is on the production repo and pulls anonymously.
  check-image-public:
    name: Check the image is public
    needs: [extract-image-info]
    # A fixed image, not ubuntu-latest: the check relies on the preinstalled curl and python3.
    runs-on: ubuntu-24.04
    # The script stops itself after 5 minutes; this is only a backstop.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check the image is public
        run: bash .github/scripts/chart-image-public.sh
        env:
          IMAGE_REPO: ${{ needs.extract-image-info.outputs.imageRepo }}
          IMAGE_TAG: ${{ needs.extract-image-info.outputs.imageTag }}
  integration-tests:
    needs: [extract-image-info, check-image-public]
    uses: ./.github/workflows/integ.yml
    with:
      imageRepo: ${{ needs.extract-image-info.outputs.imageRepo }}
      imageTagAmd64: ${{ needs.extract-image-info.outputs.imageTag }}
      imageTagArm64: ${{ needs.extract-image-info.outputs.imageTag }}
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets: inherit
  release:
    needs: [unit-test, integration-tests, check-image-public]
    permissions:
      contents: write
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            kubernetes-sigs.github.io:443
            release-assets.githubusercontent.com:443
            get.helm.sh:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Setup Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Add SSCD Helm Repo
        run: helm repo add secrets-store-csi-driver https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts

      - name: Check dependency lock is up to date
        run: |
          helm dependency update charts/secrets-store-csi-driver-provider-aws
          if ! git diff --quiet charts/secrets-store-csi-driver-provider-aws/Chart.lock; then
            echo "::error::Chart.lock is out of date. Run 'helm dependency update' and commit the changes before releasing."
            git diff charts/secrets-store-csi-driver-provider-aws/Chart.lock
            exit 1
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
