apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: nginx-assume-role-deployment-aws-secrets
spec:
  provider: aws
  parameters:
    region: us-east-1
    # Role to assume with the pod's base credentials before fetching secrets.
    # The base role needs sts:AssumeRole on it and its trust policy must allow
    # the base role; see "Role-chaining" in the README.
    assumeRoleArn: "arn:aws:iam::222222222222:role/SecretsReader"
    objects: |
      - objectName: "arn:aws:secretsmanager:us-east-1:222222222222:secret:MySecret-AbCdEf"
        objectType: "secretsmanager"
